name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: brum-brum
            name: BrumBrum
          - dir: route-des-sons
            name: RouteDesSons
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --no-daemon
        working-directory: ${{ matrix.dir }}
      - name: Rename APK
        run: cp ${{ matrix.dir }}/app/build/outputs/apk/debug/app-debug.apk ${{ matrix.name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-apk
          path: ${{ matrix.name }}.apk
