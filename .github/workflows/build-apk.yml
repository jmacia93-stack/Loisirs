name: Build APK
on:
  push:
    branches: [ main ]
    paths: [ 'brum-brum/**', '.github/workflows/build-apk.yml' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
        working-directory: brum-brum
      - name: Rename APK
        run: cp brum-brum/app/build/outputs/apk/debug/app-debug.apk BrumBrum.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BrumBrum-apk
          path: BrumBrum.apk
